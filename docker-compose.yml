# Docker Compose cho local development
# Chạy: docker-compose up -d postgres
# Sau đó chạy backend/frontend riêng như bình thường

version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: shop_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopdb}
      POSTGRES_USER: ${POSTGRES_USER:-shopuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopuser} -d ${POSTGRES_DB:-shopdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
