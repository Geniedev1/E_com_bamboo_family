worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cloudflare real IP and Forwarded Proto mapping
    map $http_cf_connecting_ip $client_real_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ===== HTTP Redirect =====
    server {
        listen 80;
        server_name api.rattanovi.com rattanovi.com www.rattanovi.com;
        return 301 https://$host$request_uri;
    }

    # ===== Main server =====
    server {
        listen 443 ssl;
        server_name api.rattanovi.com rattanovi.com www.rattanovi.com;

        ssl_certificate     /etc/ssl/cloudflare/cert.pem;
        ssl_certificate_key /etc/ssl/cloudflare/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ===== API Reverse Proxy → Spring Boot backend =====
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ===== OAuth2 callback =====
        location /oauth2/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $client_real_ip;
        }

        location /auth/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
        }

        # ===== WebSocket =====
        location /websocket {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ===== Uploaded product images + backend static assets (empty.jpg placeholder) =====
        # ^~ stops nginx from falling through to the static-asset regex location below,
        # which would otherwise match .jpg/.png and try to serve from the frontend build dir.
        location ^~ /images/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
        }

        location ^~ /static/images/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
        }

        # ===== Root redirect (Optionally redirect root to frontend domain) =====
        location / {
            return 301 https://$host; 
        }
    }
}
