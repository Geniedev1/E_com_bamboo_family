worker_processes auto;

events {
    worker_connections 1024;
}

# ==== Cấu hình HTTPS cho rattanovi.com ====
# Dùng SAU khi đã có chứng chỉ Let's Encrypt (xem DEPLOY.md).
# Kích hoạt bằng: cp nginx/nginx-ssl.conf nginx/nginx.conf && docker compose -f docker-compose.prod.yml up -d
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ===== HTTP :80 → chuyển hết sang HTTPS =====
    server {
        listen 80;
        listen [::]:80;
        server_name rattanovi.com www.rattanovi.com;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== HTTPS :443 =====
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name rattanovi.com www.rattanovi.com;

        ssl_certificate     /etc/letsencrypt/live/rattanovi.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rattanovi.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # API → Spring Boot backend
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /oauth2/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /websocket {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Ảnh upload + ảnh mẫu (empty.jpg) từ backend
        location ^~ /images/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location ^~ /static/images/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # React SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Cache asset tĩnh của frontend
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
