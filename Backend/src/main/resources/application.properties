# ===== DATABASE =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# ===== FILE UPLOAD =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== EMAIL =====
spring.mail.host=smtp.gmail.com
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.debug=false

# ===== OAUTH2 GOOGLE =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===== OAUTH2 FACEBOOK =====
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:your-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v10.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v10.0/me?fields=email,first_name,last_name,name

# ===== OAUTH2 GITHUB =====
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ===== AWS S3 =====
amazon.aws.access-key=${AWS_ACCESS_KEY:your-aws-access-key}
amazon.aws.secret-key=${AWS_SECRET_KEY:your-aws-secret-key}
amazon.s3.bucket.name=${AWS_S3_BUCKET:your-s3-bucket-name}
amazon.aws.region=${AWS_REGION:ap-southeast-1}

# ===== RECAPTCHA =====
recaptcha.secret=${RECAPTCHA_SECRET:your-recaptcha-secret}
recaptcha.url=https://www.google.com/recaptcha/api/siteverify?secret=%s&response=%s

# ===== CORS / FRONTEND =====
hostname=${FRONTEND_URL:localhost:3000}

# ===== JWT =====
jwt.header=Authorization
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-production}
jwt.expiration=604800

# ===== LOGGING =====
logging.level.com.gmail.merikbest2015.ecommerce.controller=info
